services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ghcr.io/reginalderzoah/personal-api-backend:1.0.0
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ghcr.io/reginalderzoah/personal-api-frontend:1.0.0
    ports:
      - "7860:7860"
    environment:
      PERSONAL_API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

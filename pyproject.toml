[project]
name = "personal-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Reginald Erzoah", email = "reginalderzoah10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.2",
    "gradio>=6.31.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
]

[project.scripts]
personal-api = "personal_api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
